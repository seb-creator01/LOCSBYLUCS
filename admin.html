<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | LOCSBYLUCS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .admin-body { background: var(--dark); color: white; min-height: 100vh; padding: 40px 20px; font-family: 'Inter', sans-serif; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        .login-card, .dashboard-card { background: white; color: var(--dark); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; margin-bottom: 30px; position: relative; }
        .hidden { display: none; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        .btn-post { background: var(--gold); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        /* Logout Button Style */
        .btn-exit { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; position: absolute; top: 20px; right: 20px; font-size: 0.8rem; }
        
        .manage-section { background: white; color: var(--dark); padding: 30px; border-radius: 20px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body class="admin-body">

    <div class="admin-container">
        <div id="login-section" class="login-card">
            <h2 style="font-family: 'Playfair Display', serif;">Admin Access</h2>
            <p>Enter secret passphrase</p>
            <input type="password" id="passphrase" placeholder="Passphrase">
            <button class="btn-post" onclick="checkPass()">Login</button>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="dashboard-card">
                <button class="btn-exit" onclick="logout()">Logout / Exit</button>
                
                <h2 style="font-family: 'Playfair Display', serif; color: var(--gold);">Add New Product</h2>
                <input type="text" id="p-name" placeholder="Product Name">
                <input type="text" id="p-price" placeholder="Price (e.g. ₦5,000)">
                <input type="text" id="p-img" placeholder="Image URL">
                <textarea id="p-desc" placeholder="Product Description" rows="3"></textarea>
                <button class="btn-post" id="save-btn">Upload to Shop</button>
                <p id="status-msg" style="margin-top:10px; font-size: 0.9rem; font-weight: bold;"></p>
            </div>

            <div class="manage-section">
                <h3>Manage Current Products</h3>
                <div id="manage-list"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCM4a-GtiUX8EaM4XscpjRRqnEsebUmZDg",
            authDomain: "locsbylucs.firebaseapp.com",
            projectId: "locsbylucs",
            storageBucket: "locsbylucs.firebasestorage.app",
            messagingSenderId: "19418940874",
            appId: "1:19418940874:web:f1a83f5616bd4713e73b33"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkPass() {
            const pass = document.getElementById('passphrase').value;
            if(pass === "locsbylucs123") {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadManageList();
            } else { alert("Wrong passphrase!"); }
        }

        // EXIT / LOGOUT FUNCTION
        function logout() {
            if(confirm("Are you sure you want to exit the dashboard?")) {
                window.location.href = "index.html"; // Takes her back to homepage
            }
        }

        // SAVE PRODUCT
        document.getElementById('save-btn').addEventListener('click', async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            const desc = document.getElementById('p-desc').value;
            const msg = document.getElementById('status-msg');

            if(!name || !price || !img) return alert("Fill Name, Price, and Image URL");
            msg.innerText = "Uploading...";

            try {
                await db.collection("products").add({
                    name: name, price: price, image: img, description: desc,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                msg.style.color = "green";
                msg.innerText = "Success! Product is live.";
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-img').value = "";
                document.getElementById('p-desc').value = "";
                loadManageList();
            } catch (e) { msg.style.color = "red"; msg.innerText = "Error: " + e.message; }
        });

        async function loadManageList() {
            const listDiv = document.getElementById('manage-list');
            listDiv.innerHTML = "Loading...";
            const snapshot = await db.collection("products").orderBy("createdAt", "desc").get();
            listDiv.innerHTML = "";
            snapshot.forEach(doc => {
                const p = doc.data();
                listDiv.innerHTML += `
                    <div class="product-item">
                        <div><strong>${p.name}</strong><br><small>${p.price}</small></div>
                        <button class="btn-delete" onclick="deleteProduct('${doc.id}', '${p.name}')">Delete</button>
                    </div>`;
            });
        }

        async function deleteProduct(id, name) {
            if(confirm(`Delete "${name}"?`)) {
                await db.collection("products").doc(id).delete();
                loadManageList();
            }
        }
    </script>
</body>
</html>
